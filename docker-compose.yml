name: dancemirror

x-app-environment: &app-environment
  NODE_ENV: ${APP_NODE_ENV:-development}
  HOST: 0.0.0.0
  PORT: 5173
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
  RUNTIME_MODE: persistent
  DATABASE_URL: postgres://dancemirror:${POSTGRES_PASSWORD:-dancemirror-local}@postgres:5432/dancemirror
  REDIS_URL: redis://redis:6379
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
  DATA_RETENTION_HOURS: 24
  CLEANUP_INTERVAL_MINUTES: ${CLEANUP_INTERVAL_MINUTES:-60}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  LOCAL_STORAGE_PATH: /app/data/media
  WORK_DIR: /app/data/work
  MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:-local-development-signing-secret-change-before-deploy}
  MEDIA_URL_TTL_SEC: ${MEDIA_URL_TTL_SEC:-900}
  OSS_REGION: ${OSS_REGION:-}
  OSS_BUCKET: ${OSS_BUCKET:-}
  OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
  OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
  OSS_INTERNAL: ${OSS_INTERNAL:-false}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
  DEEPSEEK_FALLBACK_MODEL: ${DEEPSEEK_FALLBACK_MODEL:-deepseek-v4-pro}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_TIMEOUT_MS: ${DEEPSEEK_TIMEOUT_MS:-45000}
  DEEPSEEK_MAX_RETRIES: ${DEEPSEEK_MAX_RETRIES:-1}

services:
  api:
    build:
      context: .
    command: ["sh", "-c", "npm run migrate && node server.js"]
    environment: *app-environment
    ports:
      - "${APP_PORT:-5173}:5173"
    volumes:
      - media-data:/app/data/media
      - work-data:/app/data/work
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
    command: ["node", "server/worker.js"]
    environment: *app-environment
    volumes:
      - media-data:/app/data/media
      - work-data:/app/data/work
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  cleanup:
    build:
      context: .
    command: ["node", "server/cleanup-scheduler.js"]
    environment: *app-environment
    volumes:
      - media-data:/app/data/media
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dancemirror
      POSTGRES_USER: dancemirror
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dancemirror-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dancemirror -d dancemirror"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  media-data:
  work-data:
  postgres-data:
  redis-data:
